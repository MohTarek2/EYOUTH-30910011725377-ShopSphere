# EYOUTH-30910011725377-ShopSphere
# Task 2.3 - Multi-Cloud Namespace Simulation
# Two isolated namespaces, each simulating a cloud provider,
# each running its own frontend pod, backend pod, and services.

# ============================================================
# Namespace: aws-simulation
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: aws-simulation
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  namespace: aws-simulation
  labels:
    app: frontend
spec:
  containers:
    - name: frontend
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: aws-simulation
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  namespace: aws-simulation
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: aws-simulation
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80

